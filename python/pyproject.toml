[project]
name = "flagbearer"
dynamic = ["version"]
description = "Flagbearer Python SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["feature-flags", "flagbearer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://flagbearer.dev"
Documentation = "https://docs.flagbearer.dev/sdks/python"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/flagbearer/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
