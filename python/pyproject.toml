[project]
name = "flagbearer-dev"
dynamic = ["version"]
description = "Feature flags for Python: checked locally, with gradual rollouts and live updates, from Flagbearer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["feature-flags", "feature-toggles", "gradual-rollouts", "flagbearer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://flagbearer.dev"
Documentation = "https://docs.flagbearer.dev/sdks/python"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The install name is flagbearer-dev; the code is still imported as flagbearer.
[tool.hatch.build.targets.wheel]
packages = ["src/flagbearer"]

[tool.hatch.version]
path = "src/flagbearer/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
