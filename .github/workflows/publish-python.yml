name: Publish Python

# Publishes the flagbearer package to PyPI through trusted publishing.
# Starts only when you run it from the Actions tab, on main. A version that's
# already published is skipped, so bump the version to release.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.2
      - run: uv run --locked pytest -q
        working-directory: python
      - run: uv build --out-dir "$RUNNER_TEMP/python-dist"
        working-directory: python
      - id: version
        run: echo "tags=python-v$(sed -nE 's/^__version__ = "(.*)"/\1/p' python/src/flagbearer/_version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: ${{ runner.temp }}/python-dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    outputs:
      tags: ${{ steps.published.outputs.tags }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Skip a version that's already published
        id: exists
        env:
          TAG: ${{ needs.build.outputs.tags }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/flagbearer-dev/${TAG#python-v}/json")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.exists.outputs.published == 'false'
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.exists.outputs.published == 'false'
      - id: published
        if: steps.exists.outputs.published == 'false'
        env:
          TAG: ${{ needs.build.outputs.tags }}
        run: echo "tags=$TAG" >> "$GITHUB_OUTPUT"

  # Marks the commit each version was published from, like needs.build.outputs.tags. Never moves a tag that exists.
  tag:
    needs: [build, publish]
    if: needs.publish.outputs.tags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Tag the release
        env:
          TAGS: ${{ needs.publish.outputs.tags }}
        run: |
          for tag in $TAGS; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "$tag"
            fi
          done
