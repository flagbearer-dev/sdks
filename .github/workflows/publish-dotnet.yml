name: Publish .NET

# Publishes the Flagbearer package to NuGet through trusted publishing.
# Starts only when you run it from the Actions tab, on main. A version that's
# already published is skipped, so bump the version to release.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: publish-.net
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test dotnet/Flagbearer.sln
      - run: dotnet pack dotnet/src/Flagbearer -c Release -o "$RUNNER_TEMP/nuget"
      - id: version
        run: echo "tags=dotnet-v$(sed -nE 's/.*<Version>(.*)<\/Version>.*/\1/p' dotnet/src/Flagbearer/Flagbearer.csproj)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget
          path: ${{ runner.temp }}/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget
          path: nuget
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  # Marks the released commit, like needs.build.outputs.tags. Never moves a tag that exists.
  tag:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Tag the release
        env:
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          for tag in $TAGS; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "$tag"
            fi
          done
