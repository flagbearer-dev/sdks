name: Publish Ruby

# Publishes the flagbearer gem to RubyGems through trusted publishing.
# Starts only when you run it from the Actions tab, on main. A version that's
# already published is skipped, so bump the version to release.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: publish-ruby
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
          working-directory: ruby
          bundler-cache: true
      - run: bundle exec rake test
        working-directory: ruby
      - run: gem build flagbearer.gemspec --output "$RUNNER_TEMP/flagbearer.gem"
        working-directory: ruby
      - id: version
        run: echo "tags=ruby-v$(sed -nE 's/.*VERSION = "(.*)"/\1/p' ruby/lib/flagbearer/version.rb)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruby-gem
          path: ${{ runner.temp }}/flagbearer.gem
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    outputs:
      tags: ${{ steps.published.outputs.tags }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ruby-gem
          path: gem
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish to RubyGems
        id: published
        env:
          TAG: ${{ needs.build.outputs.tags }}
        run: |
          version=$(gem spec gem/flagbearer.gem version | sed -nE 's/.*version: (.*)/\1/p' | head -1)
          if gem list flagbearer --remote --exact --all | grep -qE "[ (,]$version[,)]"; then
            echo "Skipping flagbearer $version: already published"
          else
            gem push gem/flagbearer.gem
            echo "tags=$TAG" >> "$GITHUB_OUTPUT"
          fi

  # Marks the commit each version was published from, like needs.build.outputs.tags. Never moves a tag that exists.
  tag:
    needs: [build, publish]
    if: needs.publish.outputs.tags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Tag the release
        env:
          TAGS: ${{ needs.publish.outputs.tags }}
        run: |
          for tag in $TAGS; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "$tag"
            fi
          done
